id: doddle.travel.search
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Compare flights, stays, activities on price, policy, loyalty for leisure and corporate"
inputs:
  - {name: origin_dest, type: string, required: true, description: "Origin and destination(s); ask if missing"}
  - {name: dates_party, type: string, required: true, description: "Dates with flex plus travelers; ask if missing"}
  - {name: motion, type: string, required: false, description: "leisure or corporate; default leisure"}
  - {name: budget_band, type: string, required: false, description: "Per-person cap; infer if missing"}
outputs:
  - {name: report, type: markdown, description: "Ranked shortlist with trade-off table"}
  - {name: action_list, type: json, description: "Next steps for verify, holds, approvals"}
tools:
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - dataforseo
  - hubspot
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: enrich, type: tool, ref: doddle.tool.v1.dataforseo.serpGoogle, needs: [assess], produces: [route_data]}
  - {id: recommend, type: agent, ref: planner, needs: [enrich], produces: [report]}
  - {id: summarize, type: agent, ref: copywriter, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
