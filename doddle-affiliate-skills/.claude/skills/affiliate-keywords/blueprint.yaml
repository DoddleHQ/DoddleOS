id: doddle.affiliate.keywords
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Build affiliate keyword portfolios and programmatic page patterns that rank"
inputs:
  - {name: niche, type: string, required: true, description: "Approved niche; ask if missing"}
  - {name: seed_url, type: string, required: false, description: "Seed site or competitor URL"}
  - {name: locale, type: string, required: false, description: "Locale; default en-US"}
outputs:
  - {name: report, type: markdown, description: "Portfolio + template structure + plan"}
  - {name: action_list, type: json, description: "Prioritized clusters and launch steps"}
tools:
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
integrations:
  - semrush
  - dataforseo
  - google-search-console
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [keyword_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
