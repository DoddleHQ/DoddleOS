id: doddle.marketing.popup-cro
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: Optimize popups, modals, overlays and slide-ins for conversion without harming UX
inputs:
  - {name: page_url, type: string, required: true, description: "Page URL where popup appears"}
  - {name: goal, type: string, required: false, description: "Primary conversion goal (email capture, discount, lead magnet)"}
outputs:
  - {name: audit_report, type: markdown, description: "Scored popup audit with findings"}
  - {name: patch_list, type: json, description: "Prioritized fixes with impact/effort"}
  - {name: test_plan, type: markdown, description: "A/B test hypotheses"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: conversion-optimizer, needs: [inputs], produces: [assessment]}
  - {id: data, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [traffic_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [data], produces: [audit_report, patch_list]}
  - {id: test, type: agent, ref: conversion-optimizer, needs: [recommend], produces: [test_plan]}
on_fail: {retry: 1, fallback: manual_review}
