id: doddle.marketing.schema-markup
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Add, fix, or optimize schema markup and structured data for rich results"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "Page URL or topic needing schema; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Target query or schema type hint; infer if missing"}
  - {name: locale, type: string, required: false, description: "Locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "Schema audit with JSON-LD implementation and placement guide"}
  - {name: action_list, type: json, description: "Prioritized schema fixes with impact"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - dataforseo
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.gsc.getSearchAnalytics, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: seo-specialist, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
