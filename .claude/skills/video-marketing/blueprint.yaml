id: doddle.marketing.video-marketing
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "When the user wants to create, optimize, or distribute video content for marketing purposes. Also use when the user mentions YouTube strategy, TikTok marketing, short-form video, or video ads."
inputs:
  - {name: brief, type: string, required: true, description: "Video brief: type, goal, audience; ask if missing"}
  - {name: channel, type: string, required: false, description: "Distribution channel(s); recommend from video type if missing"}
  - {name: budget, type: string, required: false, description: "Production budget if any; ask if missing"}
outputs:
  - {name: plan, type: markdown, description: "Video plan: concepts, scripts, production checklist, distribution, repurposing"}
  - {name: assets, type: json, description: "Machine-readable assets: scripts, hooks, thumbnails, chapters, schedule"}
tools:
  - {id: doddle.tool.v1.tiktok.trending, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.crosspost.publish, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - tiktok
  - crosspost
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: distribute, type: tool, ref: doddle.tool.v1.crosspost.publish, needs: [create], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
