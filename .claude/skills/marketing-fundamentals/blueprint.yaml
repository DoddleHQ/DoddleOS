id: doddle.marketing.marketing-fundamentals
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Marketing fundamentals: funnels, positioning, value props, psychology"
inputs:
  - {name: context, type: string, required: true, description: "Current marketing situation, audience, and funnel stage"}
  - {name: goal, type: string, required: false, description: "Desired outcome, ex awareness, leads, conversion"}
outputs:
  - {name: report, type: markdown, description: "Fundamentals assessment with positioning and funnel guidance"}
  - {name: recommendations, type: json, description: "Prioritized actions with impact/effort"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
  - notion
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: analyze, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [analytics_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [analyze], produces: [report, recommendations]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_plan]}
on_fail: {retry: 1, fallback: manual_review}
