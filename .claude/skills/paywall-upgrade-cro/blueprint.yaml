id: doddle.marketing.paywall-upgrade-cro
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: When the user wants to create or optimize in-app paywalls, upgrade screens, upsell modals, or feature gates for freemium/trial conversion
inputs:
  - {name: paywall_url, type: string, required: true, description: "Paywall or upgrade screen URL to audit"}
  - {name: plan, type: string, required: false, description: "Target plan or tier, ex Pro, Team"}
outputs:
  - {name: audit_report, type: markdown, description: "Scored paywall audit with copy and design notes"}
  - {name: patch_list, type: json, description: "Prioritized fixes with impact/effort"}
  - {name: test_plan, type: markdown, description: "A/B test hypotheses for paywall variants"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: conversion-optimizer, needs: [inputs], produces: [paywall_assessment]}
  - {id: analytics_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [traffic_data]}
  - {id: deals_check, type: tool, ref: doddle.tool.v1.hubspot.deals, needs: [analytics_check], produces: [deals_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [analytics_check, deals_check], produces: [audit_report, patch_list, test_plan]}
on_fail: {retry: 1, fallback: manual_review}
