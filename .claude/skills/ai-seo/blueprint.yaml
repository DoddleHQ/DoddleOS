id: doddle.marketing.ai-seo
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Optimize content for AI search engines, get cited by LLMs, appear in AI-generated answers"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "Topic or URL to optimize for AI search; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Primary keyword or question; infer from topic if missing"}
  - {name: locale, type: string, required: false, description: "Locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "AI SEO audit with optimization strategy and content structure"}
  - {name: action_list, type: json, description: "Prioritized actions with impact and effort"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - semrush
  - dataforseo
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
