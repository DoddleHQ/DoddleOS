id: doddle.marketing.seo-mastery
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Search optimization, keyword research, SEO audits, link strategies for organic growth"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "Topic or URL to optimize; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Primary keyword; infer from topic if missing"}
  - {name: locale, type: string, required: false, description: "Locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "SEO audit with keyword, on-page, technical, and link recommendations"}
  - {name: action_list, type: json, description: "Prioritized SEO actions with impact and effort"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - semrush
  - dataforseo
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: seo-specialist, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
