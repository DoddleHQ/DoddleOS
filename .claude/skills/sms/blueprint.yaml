id: doddle.marketing.sms
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Plan SMS campaigns, flows, and compliant lifecycle messages"
inputs:
  - {name: brief, type: string, required: true, description: "Flow type, trigger, offer, message goal"}
  - {name: audience, type: string, required: false, description: "Target audience or segment"}
  - {name: channel, type: string, required: false, description: "Delivery channel or page context"}
outputs:
  - {name: draft, type: markdown, description: "SMS flow with message copy, timing, compliance notes"}
  - {name: variants, type: json, description: "Alternative message wordings with rationale"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - hubspot
  - notion
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: draft, type: agent, ref: copywriter, needs: [brief], produces: [draft]}
  - {id: review, type: agent, ref: brand-voice-guardian, needs: [draft], produces: [reviewed_draft]}
  - {id: finalize, type: agent, ref: copywriter, needs: [review], produces: [draft, variants]}
on_fail: {retry: 1, fallback: manual_review}
