id: doddle.marketing.offers
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: Design compelling offers with value framing, guarantees, and urgency
inputs:
  - {name: context, type: string, required: true, description: "Current offer, price, inclusions, buyer, objections"}
  - {name: goal, type: string, required: false, description: "Primary goal (conversion lift, revenue target, margin)"}
outputs:
  - {name: strategy, type: markdown, description: "Offer strategy with value stack and guarantee design"}
  - {name: action_plan, type: json, description: "Offer tasks with owner, effort, impact"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: strategy, type: agent, ref: copywriter, needs: [assess], produces: [strategy]}
  - {id: plan, type: agent, ref: project-manager, needs: [strategy], produces: [action_plan]}
  - {id: validate, type: agent, ref: brand-voice-guardian, needs: [plan], produces: [validated_plan]}
on_fail: {retry: 1, fallback: manual_review}
