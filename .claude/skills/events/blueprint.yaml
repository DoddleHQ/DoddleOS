id: doddle.marketing.events
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "When the user wants to plan, run, sponsor, speak at, or get pipeline from events — webinars, conferences, trade shows, meetups, or virtual events."
inputs:
  - {name: brief, type: string, required: true, description: "Event brief: type, goal, audience; ask if missing"}
  - {name: channel, type: string, required: false, description: "Promotion/distribution channel(s); infer if missing"}
  - {name: budget, type: string, required: false, description: "Event budget if any; ask if missing"}
outputs:
  - {name: plan, type: markdown, description: "Event plan: pre/during/post checklist, agenda, promotion, follow-up"}
  - {name: assets, type: json, description: "Machine-readable assets: agenda, invites, promo copy, lead capture, follow-ups"}
tools:
  - {id: doddle.tool.v1.crosspost.publish, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - crosspost
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: planner, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: distribute, type: tool, ref: doddle.tool.v1.crosspost.publish, needs: [create], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
