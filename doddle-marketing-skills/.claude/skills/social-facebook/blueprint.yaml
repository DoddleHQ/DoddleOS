id: doddle.marketing.social-facebook
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Facebook-specific strategy: groups, events, video watch-time, community engagement, and broad/local audience reaching (35-65+)."
inputs:
  - {name: brief, type: string, required: true, description: "Campaign brief: goal, audience, key message, format preference"}
  - {name: channel, type: string, required: false, description: "Facebook; infer from brief if missing"}
  - {name: budget, type: string, required: false, description: "Paid boost / events promotion budget; organic-only if missing"}
- {name: regions, type: string, required: false, description: "Operating scope: local | national | international; infer from brief if missing"}
outputs:
  - {name: plan, type: markdown, description: "Facebook strategy: groups/events plan, cadence, video mix, community playbook"}
  - {name: assets, type: json, description: "Post assets: copy, event details, group content, hashtags, schedule, CTA"}
tools:
  - {id: doddle.tool.v1.crosspost.publish, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - crosspost
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: approve_content, type: gate, needs: [create], produces: [decision], approvers: [owner], timeout_s: 3600, on_approve: proceed, on_reject: revise}
  - {id: distribute, type: tool, ref: doddle.tool.v1.crosspost.publish, needs: [approve_content], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
