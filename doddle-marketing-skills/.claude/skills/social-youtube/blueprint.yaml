id: doddle.marketing.social-youtube
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "YouTube-specific strategy: long-form video, retention optimization, thumbnails/CTR, playlists, subscriber growth, session time."
inputs:
  - {name: brief, type: string, required: true, description: "Campaign brief: goal, audience, key message, video length/format preference"}
  - {name: channel, type: string, required: false, description: "YouTube; infer from brief if missing"}
  - {name: budget, type: string, required: false, description: "Production / promotion budget; organic-only if missing"}
outputs:
  - {name: plan, type: markdown, description: "YouTube strategy: video pillars, cadence, retention targets, playlist plan, engagement playbook"}
  - {name: assets, type: json, description: "Video assets: script/hooks, thumbnail specs, chapters, end screens, schedule, CTA"}
tools:
  - {id: doddle.tool.v1.tiktok.trending, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.crosspost.publish, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - tiktok
  - crosspost
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: approve_content, type: gate, needs: [create], produces: [decision], approvers: [owner], timeout_s: 3600, on_approve: proceed, on_reject: revise}
  - {id: distribute, type: tool, ref: doddle.tool.v1.crosspost.publish, needs: [approve_content], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
