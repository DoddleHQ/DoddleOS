id: doddle.marketing.competitor-alternatives
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Create competitor comparison and alternative pages for SEO and sales enablement"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "Your product or competitor URL/topic; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Competitor name or vs/alternative query; infer if missing"}
  - {name: locale, type: string, required: false, description: "Locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "Comparison page strategy with structure and copy outline"}
  - {name: action_list, type: json, description: "Prioritized pages and research tasks"}
tools:
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
integrations:
  - semrush
  - dataforseo
  - google-search-console
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
