id: doddle.marketing.aso
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Audit and optimize App Store and Google Play listings for visibility and downloads"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "App name or store listing URL; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Primary app keyword; infer if missing"}
  - {name: locale, type: string, required: false, description: "Store locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "ASO audit with listing optimization and keyword recommendations"}
  - {name: action_list, type: json, description: "Prioritized ASO fixes with impact"}
tools:
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - semrush
  - dataforseo
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
