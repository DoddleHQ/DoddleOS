id: doddle.marketing.influencer-marketing
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "When the user wants to run influencer, creator, or ambassador partnerships to promote their product — finding and vetting creators, structuring deals, managing campaigns, and measuring ROI."
inputs:
  - {name: brief, type: string, required: true, description: "Campaign brief: goal, audience, key messages; ask if missing"}
  - {name: channel, type: string, required: false, description: "Creator platform(s); recommend from audience if missing"}
  - {name: budget, type: string, required: false, description: "Creator budget or compensation model; ask if missing"}
outputs:
  - {name: plan, type: markdown, description: "Influencer plan: tiers, vetting shortlist, deal structures, brief, timeline"}
  - {name: assets, type: json, description: "Machine-readable assets: creator criteria, outreach list, brief terms, tracking links"}
tools:
  - {id: doddle.tool.v1.tiktok.trending, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - tiktok
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: researcher, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: distribute, type: tool, ref: doddle.tool.v1.tiktok.trending, needs: [create], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
