id: doddle.marketing.marketing-loops
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: Design recurring self-running marketing workflows and loops
inputs:
  - {name: context, type: string, required: true, description: "Manual tasks to automate, current tech stack, resources"}
  - {name: goal, type: string, required: false, description: "Primary goal (automation, compounding output, manual work reduction)"}
outputs:
  - {name: strategy, type: markdown, description: "Loop design with trigger, steps, output, metrics"}
  - {name: action_plan, type: json, description: "Loop tasks with owner, effort, impact"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: strategy, type: agent, ref: planner, needs: [assess], produces: [strategy]}
  - {id: plan, type: agent, ref: project-manager, needs: [strategy], produces: [action_plan]}
  - {id: validate, type: agent, ref: brand-voice-guardian, needs: [plan], produces: [validated_plan]}
on_fail: {retry: 1, fallback: manual_review}
