id: doddle.marketing.lead-magnets
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: Create lead magnets for email capture and lead generation
inputs:
  - {name: context, type: string, required: true, description: "Target audience, product, sales process, existing content"}
  - {name: goal, type: string, required: false, description: "Primary goal (email capture, lead quality, nurture entry)"}
outputs:
  - {name: strategy, type: markdown, description: "Lead magnet strategy with format and distribution plan"}
  - {name: action_plan, type: json, description: "Lead magnet tasks with owner, effort, impact"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: strategy, type: agent, ref: copywriter, needs: [assess], produces: [strategy]}
  - {id: plan, type: agent, ref: project-manager, needs: [strategy], produces: [action_plan]}
  - {id: validate, type: agent, ref: brand-voice-guardian, needs: [plan], produces: [validated_plan]}
on_fail: {retry: 1, fallback: manual_review}
