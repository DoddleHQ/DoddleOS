id: doddle.marketing.social-media
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Social media strategy, content creation, and platform optimization. Use when creating social content, developing engagement strategies, optimizing for platform algorithms, or building community."
inputs:
  - {name: brief, type: string, required: true, description: "Campaign brief: goal, audience, key message; ask if missing"}
  - {name: channel, type: string, required: false, description: "Target social channel(s); infer from brief if missing"}
  - {name: budget, type: string, required: false, description: "Paid boost budget if any; organic-only if missing"}
outputs:
  - {name: plan, type: markdown, description: "Channel strategy with pillars, calendar, and engagement playbook"}
  - {name: assets, type: json, description: "Machine-readable post assets: copy, hashtags, formats, schedule"}
tools:
  - {id: doddle.tool.v1.tiktok.trending, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.crosspost.publish, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - tiktok
  - crosspost
  - google-analytics
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: create, type: agent, ref: copywriter, needs: [brief], produces: [plan, assets]}
  - {id: distribute, type: tool, ref: doddle.tool.v1.crosspost.publish, needs: [create], produces: [distribution_receipt]}
  - {id: measure, type: agent, ref: conversion-optimizer, needs: [distribute], produces: [plan, assets]}
on_fail: {retry: 1, fallback: manual_review}
