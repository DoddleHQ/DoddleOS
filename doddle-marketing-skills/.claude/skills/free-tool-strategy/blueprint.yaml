id: doddle.marketing.free-tool-strategy
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Plan and evaluate free tools for lead generation, SEO value, and brand awareness"
inputs:
  - {name: topic_or_url, type: string, required: true, description: "Product or audience topic for tool ideation; ask if missing"}
  - {name: keyword, type: string, required: false, description: "Tool-related keyword; infer if missing"}
  - {name: locale, type: string, required: false, description: "Locale for language/market context; default en-US"}
outputs:
  - {name: report, type: markdown, description: "Tool strategy with concept, SEO opportunity, and build approach"}
  - {name: action_list, type: json, description: "Prioritized tool ideas with scores and next steps"}
tools:
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - semrush
  - dataforseo
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: research, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [research_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [research], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
