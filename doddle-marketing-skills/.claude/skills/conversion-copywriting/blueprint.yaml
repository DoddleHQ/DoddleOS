id: doddle.marketing.conversion-copywriting
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Write high-converting persuasive copy for pages, ads, emails"
inputs:
  - {name: brief, type: string, required: true, description: "Offer, conversion goal, traffic source, key objections"}
  - {name: audience, type: string, required: false, description: "Target audience or segment"}
  - {name: channel, type: string, required: false, description: "Delivery channel or page context"}
outputs:
  - {name: draft, type: markdown, description: "Conversion copy with headlines, body, CTAs, proof"}
  - {name: variants, type: json, description: "Alternative headlines and CTAs with rationale"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - hubspot
  - notion
nodes:
  - {id: brief, type: agent, ref: copywriter, needs: [inputs], produces: [brief_doc]}
  - {id: draft, type: agent, ref: copywriter, needs: [brief], produces: [draft]}
  - {id: review, type: agent, ref: conversion-optimizer, needs: [draft], produces: [reviewed_draft]}
  - {id: finalize, type: agent, ref: copywriter, needs: [review], produces: [draft, variants]}
on_fail: {retry: 1, fallback: manual_review}
