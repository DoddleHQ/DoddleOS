id: doddle.marketing.gsc-reporting
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Report SEO via Search Console, GA4, index, CTR, experiments, forecasts, stakeholder digests"
inputs:
  - {name: site_or_property, type: string, required: true, description: "GSC property or domain; ask if missing"}
  - {name: date_range, type: string, required: false, description: "Comparison period; default last 28d vs prior"}
  - {name: segment, type: string, required: false, description: "Brand/non-brand, device, country filter"}
outputs:
  - {name: report, type: markdown, description: "Performance, deltas, evidence, forecast"}
  - {name: action_list, type: json, description: "Next actions from findings"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.dataforseo.serpGoogle, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - google-analytics
  - dataforseo
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [assessment]}
  - {id: pull, type: tool, ref: doddle.tool.v1.gsc.getSearchAnalytics, needs: [assess], produces: [gsc_data]}
  - {id: recommend, type: agent, ref: seo-specialist, needs: [pull], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
