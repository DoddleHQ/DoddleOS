id: doddle.marketing.marketing-psychology
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: "Apply psychology mental models to marketing decisions"
inputs:
  - {name: context, type: string, required: true, description: "Marketing challenge and customer behavior to influence"}
  - {name: goal, type: string, required: false, description: "Target behavior, ex conversion, trust, urgency"}
outputs:
  - {name: report, type: markdown, description: "Applicable mental models with ethical applications"}
  - {name: recommendations, type: json, description: "Prioritized psychology tactics to test"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
  - notion
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: analyze, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [analytics_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [analyze], produces: [report, recommendations]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_plan]}
on_fail: {retry: 1, fallback: manual_review}
