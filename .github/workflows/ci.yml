name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate WordPress Agent Skills
        working-directory: wordpress-agent-skills
        run: node shared/scripts/validate-skills.mjs

      - name: Validate plugin.json
        run: |
          if [ -f ".claude-plugin/plugin.json" ]; then
            echo "Validating plugin.json..."
            node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
            echo "plugin.json is valid JSON"
          fi

      - name: Validate marketplace.json
        run: |
          if [ -f ".claude-plugin/marketplace.json" ]; then
            echo "Validating marketplace.json..."
            node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
            echo "marketplace.json is valid JSON"
          fi

      - name: Check for broken markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
        continue-on-error: true

  packs:
    name: Pack checks (${{ matrix.pack }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pack: [doddle-gtm-skills, doddle-revops-skills]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Lint pack
        working-directory: ${{ matrix.pack }}
        run: python3 scripts/lint_pack.py

      - name: Test pack
        working-directory: ${{ matrix.pack }}
        run: python3 -m pytest tests -q

      - name: drev smoke (version + doctor)
        if: matrix.pack == 'doddle-revops-skills'
        working-directory: doddle-revops-skills
        run: |
          python3 scripts/drev version
          python3 scripts/drev doctor

  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
