id: doddle.local.reviews
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Generate review ask flows and response playbooks to lift rating, velocity, and response rate
inputs:
  - {name: business_name, type: string, required: true, description: "Business name as listed"}
  - {name: location, type: string, required: true, description: "City / service area"}
  - {name: platform, type: string, required: false, description: "Primary review platform (google, yelp, facebook, tripadvisor)"}
outputs:
  - {name: reputation_audit, type: markdown, description: "Rating, velocity, and response-gap audit"}
  - {name: ask_flow, type: json, description: "Review ask sequences across SMS/email/QR/NFC"}
  - {name: response_playbook, type: markdown, description: "Positive/neutral/negative response templates + recovery plan"}
tools:
  - {id: doddle.tool.v1.gbp.listReviews, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - google-business-profile
  - hubspot
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [reputation_assessment]}
  - {id: reviews_check, type: tool, ref: doddle.tool.v1.gbp.listReviews, needs: [assess], produces: [review_data]}
  - {id: ask_design, type: agent, ref: copywriter, needs: [reviews_check], produces: [reputation_audit, ask_flow]}
  - {id: response_draft, type: agent, ref: copywriter, needs: [ask_design], produces: [response_playbook]}
on_fail: {retry: 1, fallback: manual_review}
