id: doddle.b2b.cases
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn client wins into approved case studies with multi-cut proof assets
inputs:
  - {name: client_name, type: string, required: true, description: "Customer name for case study"}
  - {name: metric, type: string, required: true, description: "Headline result metric + timeframe"}
  - {name: industry, type: string, required: false, description: "Client industry for targeting"}
outputs:
  - {name: case_brief, type: markdown, description: "Interview guide, angle, permission status"}
  - {name: case_draft, type: markdown, description: "Full case narrative with before/after/numbers"}
  - {name: distribution_plan, type: json, description: "Multi-cut asset plan + channel distribution"}
tools:
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - hubspot
  - notion
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [case_brief]}
  - {id: interview, type: agent, ref: copywriter, needs: [assess], produces: [interview_guide]}
  - {id: draft, type: agent, ref: copywriter, needs: [interview], produces: [case_draft]}
  - {id: distribute, type: agent, ref: sales-enabler, needs: [draft], produces: [distribution_plan]}
on_fail: {retry: 1, fallback: manual_review}
