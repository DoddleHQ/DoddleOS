id: doddle.b2b.linkedin
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "LinkedIn outbound: profile, warm engagement, DM sequences that book"
inputs:
  - {name: icp, type: string, required: true, description: "ICP titles + industries; ask if missing"}
  - {name: offer, type: string, required: true, description: "Offer + proof in one line; ask if missing"}
outputs:
  - {name: profile_pack, type: markdown, description: "Profile rewrite with proof and CTA"}
  - {name: sequence_pack, type: json, description: "Connect + warm + DM steps with copy"}
  - {name: reply_playbook, type: markdown, description: "Reply trees + meeting handoff bar"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - hubspot
nodes:
  - {id: angles, type: call, ref: doddle.marketing.cold-email, needs: [inputs], produces: [angle_data], inputs: {brief: $offer}}
  - {id: synthesize, type: agent, ref: copywriter, needs: [angles], produces: [profile_pack, sequence_pack, reply_playbook]}
on_fail: {retry: 1, fallback: manual_review}
