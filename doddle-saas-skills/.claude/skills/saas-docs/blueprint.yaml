id: doddle.saas.docs
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Help-center SEO that deflects tickets and ranks how-to queries"
inputs:
  - {name: page_url, type: string, required: true, description: "Docs or product URL; ask if missing"}
  - {name: activation_goal, type: string, required: false, description: "Job the docs unblock"}
outputs:
  - {name: docs_audit, type: markdown, description: "Findability + clarity audit"}
  - {name: ia_map, type: json, description: "Taxonomy + hub links"}
  - {name: article_briefs, type: markdown, description: "Top-10 briefs with schema"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - google-analytics
nodes:
  - {id: ux, type: call, ref: doddle.marketing.onboarding-cro, needs: [inputs], produces: [ux_data], inputs: {page_url: $page_url}}
  - {id: synthesize, type: agent, ref: copywriter, needs: [ux], produces: [docs_audit, ia_map, article_briefs]}
on_fail: {retry: 1, fallback: manual_review}
