id: doddle.saas.trial
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn SaaS signups into activated PQLs with trial UX, drip, and sales handoff
inputs:
  - {name: signup_url, type: string, required: true, description: "Trial signup URL to audit"}
  - {name: trial_model, type: string, required: false, description: "free-trial, freemium, or demo-led"}
  - {name: trial_length, type: string, required: false, description: "Trial duration, ex 14-day"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
outputs:
  - {name: funnel_audit, type: markdown, description: "Signup-to-activated audit with scores"}
  - {name: activation_playbook, type: markdown, description: "Checklist, drip, aha instrumentation"}
  - {name: pql_model, type: json, description: "PQL thresholds + handoff SLA"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: conversion-optimizer, needs: [inputs], produces: [funnel_assessment]}
  - {id: funnel_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [funnel_data]}
  - {id: crm_check, type: tool, ref: doddle.tool.v1.hubspot.contacts, needs: [assess], produces: [lifecycle_data]}
  - {id: activation, type: agent, ref: copywriter, needs: [funnel_check, crm_check], produces: [funnel_audit, activation_playbook]}
  - {id: scoring, type: agent, ref: lead-qualifier, needs: [activation], produces: [pql_model]}
on_fail: {retry: 1, fallback: manual_review}
