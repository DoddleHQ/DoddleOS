id: doddle.finance.reviews
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn compliant advisor reviews and testimonials into local trust with response playbooks and disclosure-safe ask flows
inputs:
  - {name: firm, type: string, required: true, description: "Firm/advisory name + market"}
  - {name: location, type: string, required: true, description: "Office location / service area"}
  - {name: platform, type: string, required: false, description: "Google, Yelp, industry directory focus"}
outputs:
  - {name: reputation_audit, type: markdown, description: "Rating, velocity, response audit with scores"}
  - {name: response_playbook, type: markdown, description: "Compliant response templates by scenario"}
  - {name: ask_flow, type: json, description: "Post-meeting ask flow spec + disclosure rules"}
tools:
  - {id: doddle.tool.v1.gbp.listReviews, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gbp.getInsights, required: false, fallback: manual_review}
integrations:
  - google-business-profile
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [reputation_assessment]}
  - {id: reviews_check, type: tool, ref: doddle.tool.v1.gbp.listReviews, needs: [assess], produces: [reviews_data]}
  - {id: responses, type: agent, ref: copywriter, needs: [reviews_check], produces: [reputation_audit, response_playbook]}
  - {id: askflow, type: agent, ref: continuity-specialist, needs: [responses], produces: [ask_flow]}
on_fail: {retry: 1, fallback: manual_review}
