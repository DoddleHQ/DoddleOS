id: doddle.sales.prospecting
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn TAM into worked A-accounts with triggers, sequencing, and clean AE handoff
inputs:
  - {name: icp, type: string, required: true, description: "Titles, size, industry, geo"}
  - {name: tam, type: string, required: true, description: "Account universe size + source"}
  - {name: quota, type: string, required: false, description: "Meeting quota per rep / month"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
outputs:
  - {name: prospect_audit, type: markdown, description: "Coverage, trigger, sequence audit"}
  - {name: list_playbook, type: json, description: "Tiering + triggers + ownership"}
  - {name: sequence_pack, type: markdown, description: "Touch pattern + handoff bar"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.semrush.domainOverview, required: false, fallback: manual_review}
integrations:
  - hubspot
  - semrush
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [tam_assessment]}
  - {id: account_check, type: tool, ref: doddle.tool.v1.semrush.domainOverview, needs: [assess], produces: [account_data]}
  - {id: list_build, type: agent, ref: lead-qualifier, needs: [account_check], produces: [prospect_audit, list_playbook]}
  - {id: sequence, type: agent, ref: copywriter, needs: [list_build], produces: [sequence_pack]}
on_fail: {retry: 1, fallback: manual_review}
