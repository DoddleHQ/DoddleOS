id: doddle.legal.guides
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Legal SEO guides and practice area pages for law firms with local intent and consult CTAs
inputs:
  - {name: practice_area, type: string, required: true, description: "PI, family, criminal, estate, etc."}
  - {name: market, type: string, required: true, description: "City + state market, ex Austin TX"}
  - {name: url, type: string, required: false, description: "Firm site URL for content audit"}
outputs:
  - {name: content_audit, type: markdown, description: "Practice-area content audit with gaps"}
  - {name: guide_template, type: markdown, description: "Guide template with hub structure and consult CTA"}
  - {name: topic_map, type: json, description: "Hub-spoke topic map with keywords"}
tools:
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - google-search-console
  - semrush
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [content_assessment]}
  - {id: keyword, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [assess], produces: [keyword_data]}
  - {id: template, type: agent, ref: copywriter, needs: [keyword], produces: [guide_template, topic_map]}
  - {id: cta, type: agent, ref: conversion-optimizer, needs: [template], produces: [content_audit, guide_template, topic_map]}
on_fail: {retry: 1, fallback: manual_review}
