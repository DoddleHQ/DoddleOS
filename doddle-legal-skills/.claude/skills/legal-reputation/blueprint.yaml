id: doddle.legal.reputation
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Build bar-safe law-firm review engine with ask flows, response playbooks, and case-result pages
inputs:
  - {name: firm, type: string, required: true, description: "Firm name + market"}
  - {name: location, type: string, required: true, description: "City / service area"}
  - {name: platform, type: string, required: false, description: "Primary review platform (google, avvo, yelp, facebook)"}
outputs:
  - {name: reputation_audit, type: markdown, description: "Rating, velocity, and response-gap audit"}
  - {name: response_playbook, type: markdown, description: "Bar-safe positive/neutral/negative response templates"}
  - {name: ask_flow, type: json, description: "Post-matter review ask sequences across SMS/email/QR"}
tools:
  - {id: doddle.tool.v1.gbp.listReviews, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gbp.getInsights, required: false, fallback: manual_review}
integrations:
  - google-business-profile
nodes:
  - {id: assess, type: agent, ref: seo-specialist, needs: [inputs], produces: [reputation_assessment]}
  - {id: reviews_check, type: tool, ref: doddle.tool.v1.gbp.listReviews, needs: [assess], produces: [review_data]}
  - {id: responses, type: agent, ref: copywriter, needs: [reviews_check], produces: [reputation_audit, response_playbook]}
  - {id: askflow, type: agent, ref: continuity-specialist, needs: [responses], produces: [ask_flow]}
on_fail: {retry: 1, fallback: manual_review}
