id: doddle.legal.intake
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn inquiries into qualified matters with triage, conflict checks, and 5-minute speed-to-lead
inputs:
  - {name: firm, type: string, required: true, description: "Firm name + market"}
  - {name: practice_area, type: string, required: true, description: "PI, family, criminal, estate, etc."}
  - {name: volume, type: string, required: false, description: "Monthly inquiry volume"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
outputs:
  - {name: intake_audit, type: markdown, description: "Inquiry-to-qualified audit with scores"}
  - {name: qualification_rubric, type: json, description: "Fit + value triage rubric"}
  - {name: speed_playbook, type: markdown, description: "5-min response + conflict-check flow"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - hubspot
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: lead-qualifier, needs: [inputs], produces: [intake_assessment]}
  - {id: funnel_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [funnel_data]}
  - {id: triage, type: agent, ref: copywriter, needs: [funnel_check], produces: [intake_audit, qualification_rubric]}
  - {id: speed, type: agent, ref: continuity-specialist, needs: [triage], produces: [speed_playbook]}
on_fail: {retry: 1, fallback: manual_review}
