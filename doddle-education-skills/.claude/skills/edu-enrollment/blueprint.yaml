id: doddle.edu.enrollment
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn inquiries into enrolled students with fast response, parent/student tracks, and melt prevention
inputs:
  - {name: institution, type: string, required: true, description: "School/college/course brand + market"}
  - {name: program, type: string, required: true, description: "Flagship program or intake term"}
  - {name: cycle, type: string, required: false, description: "Admission cycle length, ex annual/semester"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
outputs:
  - {name: funnel_audit, type: markdown, description: "Inquiry-to-enrolled audit with melt analysis"}
  - {name: track_model, type: json, description: "Parent vs student tracks + stage SLAs"}
  - {name: chase_sequences, type: markdown, description: "Deadline + document chase + melt rescue"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - hubspot
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: lead-qualifier, needs: [inputs], produces: [funnel_assessment]}
  - {id: funnel_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [funnel_data]}
  - {id: tracks, type: agent, ref: copywriter, needs: [funnel_check], produces: [funnel_audit, track_model]}
  - {id: chase, type: agent, ref: continuity-specialist, needs: [tracks], produces: [chase_sequences]}
on_fail: {retry: 1, fallback: manual_review}
