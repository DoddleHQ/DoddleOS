id: doddle.ecommerce.plp
version: 1.5.1
kind: skill
engine: doddle-os>=1.0
description: Optimize eCommerce category/listing pages (PLP) for conversion, SEO, UX
inputs:
  - {name: page_url, type: string, required: true, description: "Category/PLP URL to audit"}
  - {name: category_keyword, type: string, required: false, description: "Primary SEO keyword"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
  - {name: traffic_source, type: string, required: false, description: "Organic, paid, email, direct"}
outputs:
  - {name: audit_report, type: markdown, description: "Scored audit across 5 dimensions"}
  - {name: patch_list, type: json, description: "Prioritized fixes with impact/effort"}
  - {name: test_plan, type: markdown, description: "A/B test hypotheses"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.semrush.keywordResearch, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - google-search-console
  - semrush
nodes:
  - {id: assess, type: agent, ref: conversion-optimizer, needs: [inputs], produces: [ux_assessment]}
  - {id: analytics_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [traffic_data]}
  - {id: seo_check, type: tool, ref: doddle.tool.v1.gsc.getSearchAnalytics, needs: [assess], produces: [search_data]}
  - {id: keyword_check, type: tool, ref: doddle.tool.v1.semrush.keywordResearch, needs: [seo_check], produces: [keyword_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [analytics_check, keyword_check], produces: [audit_report, patch_list]}
  - {id: test_design, type: agent, ref: conversion-optimizer, needs: [recommend], produces: [test_plan]}
on_fail: {retry: 1, fallback: manual_review}
