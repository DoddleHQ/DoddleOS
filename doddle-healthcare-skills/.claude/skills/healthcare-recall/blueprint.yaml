id: doddle.health.recall
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Bring overdue patients back with tiered recall sequences and front-desk reactivation
inputs:
  - {name: practice_name, type: string, required: true, description: "Clinic/practice name"}
  - {name: specialty, type: string, required: true, description: "Dental, physio, derm, etc."}
  - {name: recall_interval, type: string, required: false, description: "Default recall interval, ex 6mo hygiene"}
outputs:
  - {name: recall_audit, type: markdown, description: "Overdue-patient audit with tier breakdown"}
  - {name: recall_sequence, type: markdown, description: "SMS/email/call recall sequence + scripts"}
  - {name: tier_plan, type: json, description: "Overdue-tier actions + owners + targets"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - hubspot
  - google-analytics
nodes:
  - {id: assess, type: agent, ref: continuity-specialist, needs: [inputs], produces: [recall_assessment]}
  - {id: segment, type: tool, ref: doddle.tool.v1.hubspot.contacts, needs: [assess], produces: [overdue_segments]}
  - {id: sequence, type: agent, ref: copywriter, needs: [segment], produces: [recall_audit, recall_sequence]}
  - {id: scripts, type: agent, ref: continuity-specialist, needs: [sequence], produces: [tier_plan]}
on_fail: {retry: 1, fallback: manual_review}
