id: doddle.health.booking
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: Turn clinic website visitors into booked appointments with low no-show rate
inputs:
  - {name: practice_name, type: string, required: true, description: "Clinic/practice name"}
  - {name: specialty, type: string, required: true, description: "Dental, physio, derm, etc."}
  - {name: booking_url, type: string, required: false, description: "Online booking URL to audit"}
  - {name: locale, type: string, required: false, description: "Market locale, ex en-US"}
outputs:
  - {name: funnel_audit, type: markdown, description: "Visit-to-booked audit with scores"}
  - {name: reminder_sequence, type: markdown, description: "SMS/email reminder + waitlist flow"}
  - {name: noshow_plan, type: json, description: "No-show recovery actions + owners"}
tools:
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
integrations:
  - google-analytics
  - hubspot
nodes:
  - {id: assess, type: agent, ref: conversion-optimizer, needs: [inputs], produces: [funnel_assessment]}
  - {id: funnel_check, type: tool, ref: doddle.tool.v1.ga4.getReport, needs: [assess], produces: [funnel_data]}
  - {id: booking_flow, type: agent, ref: copywriter, needs: [funnel_check], produces: [funnel_audit, reminder_sequence]}
  - {id: recovery, type: agent, ref: continuity-specialist, needs: [booking_flow], produces: [noshow_plan]}
on_fail: {retry: 1, fallback: manual_review}
