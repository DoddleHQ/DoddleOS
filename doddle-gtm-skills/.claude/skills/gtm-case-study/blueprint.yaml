id: doddle.gtm.gtm-case-study
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "enablement-lead skill for case study."
inputs:
  - {name: customer, type: string, required: true, description: "Customer the story is about"}
  - {name: results, type: string, required: true, description: "User-supplied, verified results"}
outputs:
  - {name: case_study, type: markdown, description: "Case study"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - notion
nodes:
  - {id: analyze, type: agent, ref: enablement-lead, needs: [inputs], produces: [case_study]}
on_fail: {retry: 1, fallback: manual_review}
