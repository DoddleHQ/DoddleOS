id: doddle.gtm.gtm-pricing
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "gtm-strategist skill for pricing."
inputs:
  - {name: price, type: number, required: true, description: "List price"}
  - {name: variable-cost, type: number, required: true, description: "Variable cost per unit/account"}
  - {name: fixed-cost, type: number, required: false, description: "Fixed cost for break-even"}
outputs:
  - {name: analysis, type: markdown, description: "Pricing analysis"}
  - {name: envelope, type: json, description: "Pricing envelope"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["pricing"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: gtm-strategist, needs: [run], produces: [analysis]}
on_fail: {retry: 1, fallback: manual_review}
