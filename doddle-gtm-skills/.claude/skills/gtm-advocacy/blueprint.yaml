id: doddle.gtm.advocacy
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Turn customers into proof: references, reviews, cases, community flywheel"
inputs:
  - {name: product_offer, type: string, required: true, description: "Offer and outcomes; ask if missing"}
  - {name: segment, type: string, required: false, description: "Proof gap segment; infer if missing"}
  - {name: locale, type: string, required: false, description: "Market; default en-US"}
outputs:
  - {name: report, type: markdown, description: "Reference bench, review plan, case pipeline"}
  - {name: action_list, type: json, description: "Advocacy actions with owner and effort"}
tools:
  - {id: doddle.tool.v1.hubspot.contacts, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gsc.getSearchAnalytics, required: false, fallback: manual_review}
integrations:
  - hubspot
  - google-search-console
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [assessment]}
  - {id: enrich, type: tool, ref: doddle.tool.v1.hubspot.contacts, needs: [assess], produces: [account_data]}
  - {id: recommend, type: agent, ref: copywriter, needs: [enrich], produces: [report]}
  - {id: plan, type: agent, ref: planner, needs: [recommend], produces: [action_list]}
on_fail: {retry: 1, fallback: manual_review}
