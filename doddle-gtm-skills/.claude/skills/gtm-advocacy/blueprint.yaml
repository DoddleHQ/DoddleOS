id: doddle.gtm.gtm-advocacy
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "partner-manager skill for advocacy."
inputs:
  - {name: proof, type: string, required: true, description: "Customer proof assets or references available"}
  - {name: goal, type: string, required: false, description: "Reviews, referrals, references or community"}
outputs:
  - {name: program, type: markdown, description: "Advocacy program design"}
  - {name: envelope, type: json, description: "Audit envelope"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - hubspot
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["report"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: partner-manager, needs: [run], produces: [program]}
on_fail: {retry: 1, fallback: manual_review}
