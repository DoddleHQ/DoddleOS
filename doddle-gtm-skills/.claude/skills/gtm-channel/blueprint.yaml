id: doddle.gtm.gtm-channel
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "revenue-analyst skill for channel."
inputs:
  - {name: cac, type: number, required: true, description: "Channel acquisition cost assumption"}
  - {name: arpa, type: number, required: true, description: "Average revenue per account, monthly"}
  - {name: gross-margin, type: number, required: false, description: "Gross margin fraction"}
  - {name: churn, type: number, required: false, description: "Monthly churn rate"}
outputs:
  - {name: analysis, type: markdown, description: "Channel economics analysis"}
  - {name: envelope, type: json, description: "Unit-economics envelope"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["unit-economics"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: revenue-analyst, needs: [run], produces: [analysis]}
on_fail: {retry: 1, fallback: manual_review}
