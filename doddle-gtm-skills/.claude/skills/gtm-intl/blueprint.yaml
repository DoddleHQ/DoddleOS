id: doddle.gtm.gtm-intl
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "gtm-strategist skill for intl."
inputs:
  - {name: markets, type: string, required: true, description: "Candidate markets to rank"}
  - {name: criteria, type: string, required: false, description: "Ranking axes (fit, effort, readiness)"}
outputs:
  - {name: plan, type: markdown, description: "Locale ranking and minimum launch pack"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
nodes:
  - {id: analyze, type: agent, ref: gtm-strategist, needs: [inputs], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
