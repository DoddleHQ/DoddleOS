id: doddle.gtm.gtm-win-loss
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "revenue-analyst skill for win loss."
inputs:
  - {name: export, type: file, required: true, description: "Closed-deal export (JSON or CSV)"}
  - {name: interviews, type: file, required: false, description: "Win/loss interview notes"}
outputs:
  - {name: analysis, type: markdown, description: "Win/loss analysis"}
  - {name: envelope, type: json, description: "Audit envelope"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gong.calls, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - gong
  - hubspot
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["audit"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: revenue-analyst, needs: [run], produces: [analysis]}
on_fail: {retry: 1, fallback: manual_review}
