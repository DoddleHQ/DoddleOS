id: doddle.gtm.gtm-icp
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "positioning-strategist skill for icp."
inputs:
  - {name: criteria, type: string, required: true, description: "Weighted qualifying criteria for the ICP"}
  - {name: accounts, type: file, required: false, description: "Optional account list to score against the ICP"}
outputs:
  - {name: icp, type: markdown, description: "ICP definition"}
  - {name: envelope, type: json, description: "Weighted score envelope"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.clearbit.company, required: false, fallback: manual_review}
integrations:
  - clearbit
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["score"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: positioning-strategist, needs: [run], produces: [icp]}
on_fail: {retry: 1, fallback: manual_review}
