id: doddle.gtm.gtm-launch
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "gtm-strategist skill for launch."
inputs:
  - {name: product, type: string, required: true, description: "What is launching"}
  - {name: attributes, type: string, required: true, description: "Objective, audience, channels"}
outputs:
  - {name: plan, type: markdown, description: "GTM launch plan and checklist"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - notion
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: gtm-strategist, needs: [run], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
