id: doddle.gtm.gtm-messaging
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "positioning-strategist skill for messaging."
inputs:
  - {name: positioning, type: string, required: true, description: "The agreed positioning"}
  - {name: personas, type: string, required: false, description: "Personas to message to"}
outputs:
  - {name: messaging, type: markdown, description: "Messaging house"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: positioning-strategist, needs: [run], produces: [messaging]}
on_fail: {retry: 1, fallback: manual_review}
