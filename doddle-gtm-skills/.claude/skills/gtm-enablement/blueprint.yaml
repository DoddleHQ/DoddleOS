id: doddle.gtm.gtm-enablement
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "enablement-lead skill for enablement."
inputs:
  - {name: team, type: string, required: true, description: "Who is being enabled"}
  - {name: gaps, type: string, required: false, description: "Known skill or knowledge gaps"}
outputs:
  - {name: program, type: markdown, description: "Enablement program"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.gong.calls, required: false, fallback: manual_review}
integrations:
  - notion
  - gong
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: enablement-lead, needs: [run], produces: [program]}
on_fail: {retry: 1, fallback: manual_review}
