id: doddle.gtm.enablement
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "One brief to decks, one-pagers, battlecards, and rep ramp"
inputs:
  - {name: context, type: string, required: true, description: "Product, buyer, use case; ask if missing"}
  - {name: goal, type: string, required: false, description: "Enablement goal"}
outputs:
  - {name: asset_gap, type: markdown, description: "What reps send vs what exists"}
  - {name: enablement_kit, type: json, description: "Deck, one-pager, battlecard refs"}
  - {name: ramp_plan, type: markdown, description: "Certification + shadow + first deals"}
tools:
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.hubspot.deals, required: false, fallback: manual_review}
integrations:
  - notion
  - hubspot
nodes:
  - {id: demo_base, type: call, ref: doddle.b2b.demo, needs: [inputs], produces: [demo_data], inputs: {context: $context}}
  - {id: synthesize, type: agent, ref: sales-enabler, needs: [demo_base], produces: [asset_gap, enablement_kit, ramp_plan]}
on_fail: {retry: 1, fallback: manual_review}
