id: doddle.gtm.gtm-strategy
version: 0.2.0
kind: skill
engine: doddle-os>=1.0
description: "gtm-strategist skill for strategy."
inputs:
  - {name: objective, type: string, required: true, description: "What the plan must achieve"}
  - {name: segment, type: string, required: false, description: "Primary segment; defaults to SMB"}
  - {name: inputs, type: file, required: false, description: "User-supplied assumptions (ACV, churn, funnel counts)"}
outputs:
  - {name: plan, type: markdown, description: "The assembled go-to-market plan"}
tools:
  - {id: doddle.tool.cli.dgtm, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.notion.pages, required: false, fallback: manual_review}
integrations:
  - notion
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dgtm, args: ["unit-economics"], needs: [inputs], produces: [envelope]}
  - {id: run_2, type: tool, ref: doddle.tool.cli.dgtm, args: ["funnel"], needs: [run], produces: [envelope]}
  - {id: narrate, type: agent, ref: gtm-strategist, needs: [run_2], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
