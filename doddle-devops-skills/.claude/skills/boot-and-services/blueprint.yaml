id: doddle.devops.boot
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Fix boot failures, manage grub/grub2 and kernel parameters, administer systemd services and targets"
inputs:
  - {name: symptom, type: string, required: true, description: "Boot failure or service problem observed"}
  - {name: unit, type: string, required: false, description: "systemd unit name; discover via systemctl --failed if missing"}
outputs:
  - {name: report, type: markdown, description: "Boot/service diagnosis, actions, verification"}
  - {name: unit_change, type: json, description: "Enable/disable/mask/edit actions with rollback notes"}
tools: []
integrations: []
nodes:
  - {id: survey, type: agent, ref: devops-surveyor, needs: [inputs], produces: [boot_evidence]}
  - {id: analyze, type: agent, ref: devops-analyst, needs: [survey], produces: [boot_diagnosis]}
  - {id: approve_change, type: gate, needs: [analyze], produces: [decision], approvers: [owner], timeout_s: 3600, on_approve: proceed, on_reject: revise}
  - {id: apply, type: agent, ref: devops-operator, needs: [approve_change], produces: [unit_change]}
  - {id: verify, type: agent, ref: devops-operator, needs: [apply], produces: [report]}
on_fail: {retry: 1, fallback: manual_review}
