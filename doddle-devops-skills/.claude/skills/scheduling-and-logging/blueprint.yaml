id: doddle.devops.scheduling
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Schedule at/cron jobs and manage logging: rsyslog routing, logger tests, login audit, logrotate"
inputs:
  - {name: task, type: string, required: true, description: "Schedule a job, fix a cron, route/rotate/audit logs"}
  - {name: schedule, type: string, required: false, description: "Cron expression or at-time; propose if missing"}
  - {name: log_scope, type: string, required: false, description: "Facility or log file in question"}
outputs:
  - {name: report, type: markdown, description: "Schedule/logging change, evidence, verification"}
  - {name: jobs_registry, type: json, description: "Jobs created or changed with schedules and owners"}
tools: []
integrations: []
nodes:
  - {id: survey, type: agent, ref: devops-surveyor, needs: [inputs], produces: [sched_log_evidence]}
  - {id: analyze, type: agent, ref: devops-analyst, needs: [survey], produces: [sched_log_plan]}
  - {id: approve_change, type: gate, needs: [analyze], produces: [decision], approvers: [owner], timeout_s: 3600, on_approve: proceed, on_reject: revise}
  - {id: apply, type: agent, ref: devops-operator, needs: [approve_change], produces: [jobs_registry]}
  - {id: verify, type: agent, ref: devops-operator, needs: [apply], produces: [report]}
on_fail: {retry: 1, fallback: manual_review}
