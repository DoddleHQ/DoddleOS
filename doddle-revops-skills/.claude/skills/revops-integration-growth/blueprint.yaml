id: doddle.revops.revops-integration-growth
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Audit integration-led growth readiness — OAuth scopes, webhook coverage, marketplace listing, and co-selling fields."
inputs:
  - {name: catalog, type: file, required: true, description: "Integration catalog (JSON) with integrations[]"}
  - {name: segment, type: string, required: false, description: "Segment focus; defaults to SMB"}
outputs:
  - {name: report, type: markdown, description: "Readiness scores, failed checks, and the build order"}
  - {name: envelope, type: json, description: "Deterministic integration-readiness envelope"}
tools:
  - {id: doddle.tool.cli.drev, required: false, fallback: manual_review}
integrations: []
nodes:
  - {id: survey, type: agent, ref: revops-data-engineer, needs: [inputs], produces: [assessment]}
  - {id: audit, type: tool, ref: doddle.tool.cli.drev, args: ["integration-audit"], needs: [survey], produces: [envelope]}
  - {id: report, type: agent, ref: revops-growth-operator, needs: [audit], produces: [report]}
on_fail: {retry: 1, fallback: manual_review}
