id: doddle.revops.revops-call-intelligence
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Search recorded calls for themes, quote the evidence, and turn it into coaching and battlecard updates."
inputs:
  - {name: transcripts, type: file, required: true, description: "Call transcripts (JSONL/CSV) with call_id, speaker, text"}
  - {name: query, type: string, required: true, description: "Search terms; every term must appear in the excerpt"}
  - {name: themes, type: file, required: false, description: "Theme map (JSON): {\"theme\": [\"keyword\", ...]}"}
outputs:
  - {name: report, type: markdown, description: "Quoted evidence, theme clusters, and coaching/battlecard deltas"}
  - {name: envelope, type: json, description: "Deterministic call-search envelope"}
tools:
  - {id: doddle.tool.cli.drev, required: false, fallback: manual_review}
integrations: []
nodes:
  - {id: survey, type: agent, ref: revops-data-engineer, needs: [inputs], produces: [assessment]}
  - {id: search, type: tool, ref: doddle.tool.cli.drev, args: ["call-search"], needs: [survey], produces: [envelope]}
  - {id: report, type: agent, ref: revops-customer-insights, needs: [search], produces: [report]}
on_fail: {retry: 1, fallback: manual_review}
