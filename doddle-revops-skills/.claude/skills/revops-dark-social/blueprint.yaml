id: doddle.revops.revops-dark-social
version: 1.1.0
kind: skill
engine: doddle-os>=1.0
description: "Model dark-social and community attribution — self-reported and survey-modelled sources, influenced revenue, confidence, and consent flags."
inputs:
  - {name: community, type: file, required: true, description: "Community activity (CSV/JSON) with person_id, community, activity_date"}
  - {name: surveys, type: file, required: false, description: "Survey responses (CSV/JSON) with person_id, heard_from, other_source, consent"}
  - {name: deals, type: file, required: false, description: "Deals export (CSV/JSON) linking person_id to won revenue"}
  - {name: segment, type: string, required: false, description: "Segment filter; defaults to SMB"}
outputs:
  - {name: report, type: markdown, description: "Attribution bases, influenced revenue, confidence, and consent gaps"}
  - {name: envelope, type: json, description: "Deterministic community-attribution envelope"}
  - {name: community_evidence, type: json, description: "Live community message evidence when a Discord server is configured"}
tools:
  - {id: doddle.tool.cli.drev, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.discord.readMessages, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.discord.searchMessages, required: false, fallback: manual_review}
integrations:
  - discord
nodes:
  - {id: survey, type: agent, ref: revops-data-engineer, needs: [inputs], produces: [assessment]}
  - {id: attribute, type: tool, ref: doddle.tool.cli.drev, args: ["community-attribution"], needs: [survey], produces: [envelope]}
  - {id: community_evidence, type: tool, ref: doddle.tool.v1.discord.readMessages, args: ["{inputs.community}"], needs: [attribute], produces: [community_evidence]}
  - {id: report, type: agent, ref: revops-signal-analyst, needs: [community_evidence], produces: [report]}
on_fail: {retry: 1, fallback: manual_review}
