id: doddle.agency.client-onboarding
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
domains: [agency]
description: "Onboard new agency clients: kickoff process, access checklist, communication cadence, expectation setting, and success criteria"
inputs:
  - {name: brief, type: string, required: true, description: "New client details, engagement type, scope, start date; ask if missing"}
  - {name: contract, type: string, required: false, description: "Signed SOW or contract reference with scope and terms"}
  - {name: regions, type: string, required: false, description: "Operating scope: local | national | international; infer from brief if missing"}
outputs:
  - {name: onboarding_plan, type: markdown, description: "Kickoff workflow: milestones, owners, first-30-days plan"}
  - {name: access_checklist, type: json, description: "Machine-readable access and asset checklist with owners and status"}
  - {name: kickoff_deck, type: markdown, description: "Kickoff agenda and deck content: intro, scope, cadence, success criteria"}
tools: []
integrations: []
nodes:
  - {id: assess, type: agent, ref: researcher, needs: [inputs], produces: [onboarding_assessment]}
  - {id: plan, type: agent, ref: planner, needs: [assess], produces: [onboarding_plan, access_checklist]}
  - {id: prepare, type: agent, ref: continuity-specialist, needs: [plan], produces: [kickoff_deck]}
on_fail: {retry: 1, fallback: manual_review}
