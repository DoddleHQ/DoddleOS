id: doddle.wordpress.wordpress-router
version: 1.0.0
kind: skill
engine: doddle-os>=1.0
description: "Classify a WordPress repository and route work to the correct guarded workflow."
inputs:
  - {name: context, type: string, required: true, description: "WordPress task, user intent, and relevant repository context"}
  - {name: repo_path, type: string, required: false, description: "WordPress repository or site root; defaults to the current working directory"}
  - {name: goal, type: string, required: false, description: "Desired outcome or acceptance criteria; infer from context when omitted"}
  - {name: constraints, type: string, required: false, description: "Version, environment, security, downtime, or tooling constraints"}
outputs:
  - {name: report, type: markdown, description: "Evidence, actions, verification results, and unresolved questions"}
  - {name: recommendations, type: json, description: "Prioritized next steps with owners, risks, and acceptance checks"}
tools: []
integrations: []
nodes:
  - {id: assess, type: agent, ref: wordpress-surveyor, needs: [inputs], produces: [assessment]}
  - {id: route, type: agent, ref: wordpress-engineer, needs: [assess], produces: [report, recommendations]}
  - {id: verify, type: agent, ref: wordpress-reviewer, needs: [route], produces: [verification]}
on_fail: {retry: 1, fallback: manual_review}
